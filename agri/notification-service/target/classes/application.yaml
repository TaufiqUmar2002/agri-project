server:
  port: 8090

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-cg
      auto-offset-reset: earliest

notification:
  kafka:
    enabled: ${NOTIFICATION_KAFKA_ENABLED:false}
    notification-topic: platform.notification.events
  rules:
    dedupe-window-seconds: 600
    ussd-session-ttl-seconds: 90
    callback-skew-seconds: 300
    broadcast-dual-control-threshold: 5000
    max-sms-segments: 3
    ussd-hmac-secret: ${USSD_HMAC_SECRET:agreeshield-ussd-secret}
    aggregator-hmac-secret: ${AGGREGATOR_HMAC_SECRET:agreeshield-agg-secret}
    sweeper-ack-timeout-seconds: 120
