server:
  port: 8092

spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://localhost:5432/audit_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: audit-service-cg
      auto-offset-reset: earliest

audit:
  kafka:
    enabled: ${AUDIT_KAFKA_ENABLED:false}
    audit-topic: platform.audit.events
  rules:
    max-unscoped-search-days: 31
    max-accept-risk-months: 12
    clock-skew-seconds: 300
    signing-key-id: ${AUDIT_SIGNING_KEY_ID:kms_audit_key_v1}
    signing-secret: ${AUDIT_SIGNING_SECRET:agreeshield-audit-kms-secret}
