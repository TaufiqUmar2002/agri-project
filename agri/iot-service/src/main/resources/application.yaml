server:
  port: 8091

spring:
  application:
    name: iot-service
  datasource:
    url: jdbc:postgresql://localhost:5432/iot_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: iot-ingest-cg
      auto-offset-reset: earliest

iot:
  kafka:
    enabled: ${IOT_KAFKA_ENABLED:false}
    observation-topic: observation.sensor
    iot-topic: platform.iot.events
  rules:
    max-payload-bytes: 8192
    max-per-plot-type: 3
    rain-gauge-max-distance-meters: 500.0
    rain-gauge-warn-distance-meters: 150.0
