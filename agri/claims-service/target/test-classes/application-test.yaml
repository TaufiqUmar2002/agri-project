server:
  port: 0

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:claimstest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

claims:
  grpc:
    port: 0
    service-token: dev-internal-service-token
    allowed-callers: payout-service
  kafka:
    enabled: false
  rules:
    retry-cooldown-minutes: 10
