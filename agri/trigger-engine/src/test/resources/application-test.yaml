server:
  port: 0

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:triggertest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

trigger:
  grpc:
    port: 0
    service-token: dev-internal-service-token
    status-allowed-callers: claims-service,payout-service,riskpool-service,audit-service
    simulation-allowed-callers: policy-service
  kafka:
    enabled: false
