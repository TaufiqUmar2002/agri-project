server:
  port: 8088

spring:
  application:
    name: payout-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payout_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payout-service-cg
      auto-offset-reset: earliest

payout:
  kafka:
    enabled: ${PAYOUT_KAFKA_ENABLED:false}
    payout-topic: platform.payout.events
  rules:
    max-fallback-switches: 2
    escalation-hours: 24
    voucher-expiry-days: 7
    callback-skew-seconds: 300
