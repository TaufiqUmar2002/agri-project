spring:
  application:
    name: common-test-module
  datasource:
    url: jdbc:h2:mem:commonlogtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

agreeshield:
  logging:
    enabled: true
    prefer-db: true
    info-enabled: true
    debug-enabled: false
    exception-enabled: true
    request-response-enabled: true
    security-enabled: true
    external-call-enabled: true
